[tool.poetry]
name = "mlops-docker-mlflow-fastapi"
version = "0.1.0"
description = "MLOps pipeline with MLflow, FastAPI and Docker"
authors = ["Ksenia"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"

fastapi = "*"
uvicorn = "*"
pandas = "*"
scikit-learn = "*"
mlflow = "*"
pydantic = "*"
pyyaml = "*"
joblib = "*"
httpx = "^0.28.1"

[tool.poetry.group.dev.dependencies]
pytest = "*"
ruff = "*"
black = "*"
mypy = "*"
pre-commit = "*"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"


[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
